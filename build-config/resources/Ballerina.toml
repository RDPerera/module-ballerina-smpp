[package]
org = "ballerina"
name = "smpp"
version = "@toml.version@"
authors = ["Ballerina"]
keywords = ["smpp", "sms", "messaging", "Type/Connector", "Type/Trigger", "Area/Built-in", "Area/Messaging", "Name/SMPP"]
repository = "https://github.com/ballerina-platform/module-ballerina-smpp"
icon = "icon.png"
license = ["Apache-2.0"]
# Must stay in lockstep with `ballerinaLangVersion` in gradle.properties — the
# io.ballerina.plugin harness builds and tests the package with exactly that distribution,
# so declaring a higher minimum here would claim support for a version nothing is built on.
distribution = "2201.12.0"

[build-options]
observabilityIncluded = false

[platform.java21]
# Deliberate, not a known technical blocker: GraalVM native-image builds are very slow, and
# native-image support is not a requirement for this package, so the build cost is not
# justified. Whether jsmpp would work under native-image at all is untested and unknown.
# Revisit only if a consumer actually needs it.
graalvmCompatible = false

# Hand-written native glue that bridges jsmpp into the Ballerina runtime (Client + Listener).
[[platform.java21.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "smpp-native"
version = "@project.version@"
path = "../native/build/libs/smpp-native-@project.version@.jar"

# Test-only bridge to the mock SMSC (native/src/testBridge) used by ballerina/tests/.
[[platform.java21.dependency]]
groupId = "io.ballerina.stdlib"
artifactId = "smpp-native-test-bridge"
version = "@project.version@"
path = "../native/build/libs/smpp-native-test-bridge-@project.version@.jar"
scope = "testOnly"

# jsmpp, copied into ./lib by copyToLib. Its slf4j-api dependency is NOT bundled — the
# Ballerina runtime already provides slf4j on the classpath (bundling it duplicates slf4j).
[[platform.java21.dependency]]
groupId = "org.jsmpp"
artifactId = "jsmpp"
version = "@jsmpp.version@"
path = "./lib/jsmpp-@jsmpp.version@.jar"
