org.gradle.caching=true

group=io.ballerina.stdlib
# -SNAPSHOT on the development branch, as every stdlib module: the release pipeline
# (`./gradlew release`, net.researchgate.release) strips it for the release and bumps to the
# next snapshot; the io.ballerina.plugin build strips it for the Ballerina.toml version.
version=1.0.0-SNAPSHOT

ballerinaGradlePluginVersion=4.0.0
ballerinaLangVersion=2201.12.0

# Checkstyle/SpotBugs/release tooling (build-config/checkstyle, compiler-plugin/build.gradle,
# native/build.gradle, spotbugs-exclude.xml, the root release block) — pinned to the same
# versions module-ballerina-email uses.
checkstylePluginVersion=10.12.0
downloadPluginVersion=5.4.0
spotbugsPluginVersion=6.5.1
releasePluginVersion=3.1.0

# compiler-plugin-tests only, matching module-ballerina-email's pinned version.
testngVersion=7.6.1

# jsmpp is bundled into ballerina/lib by the io.ballerina.plugin `copyToLib` task and
# referenced by path in ballerina/Ballerina.toml, so the published package carries its own jar
# and needs no Maven resolution at a consumer's build time. Its slf4j-api dependency is
# deliberately NOT bundled — the Ballerina runtime already provides slf4j on the classpath.
jsmppVersion=3.0.2
