name: Release

# Publishes ballerina/smpp to Ballerina Central. NOTE: Central pushes are IMMUTABLE — a
# version can be published only once. Triggers:
#   - Push a version tag (e.g. v1.0.0)  -> build + test + pack + PUBLISH to Central.
#   - Run manually (workflow_dispatch)  -> DRY RUN by default (build + test + pack + push to a
#     local repo; Central is NOT touched). Tick "publish" to actually publish from a manual run.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Ballerina Central? Central is IMMUTABLE. Leave unchecked for a dry run."
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Installs bal on the runner for the pack/push steps. Must match ballerinaLangVersion in
      # gradle.properties, which is the distribution the gradle build builds and tests with.
      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1
        with:
          version: 2201.12.0

      - name: Build and test
        env:
          # Resolves io.ballerina.plugin and jballerina-tools from ballerina-platform GitHub
          # Packages, matching the convention in ballerina-library's own build templates.
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --stacktrace

      - name: Pack
        working-directory: ballerina
        run: |
          bal pack
          echo "== Publishable artifact =="
          ls -l target/bala/*.bala

      # Dry run: exercise the push mechanics against a local repo — no Central, no token.
      - name: Dry-run push (local repository only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true' }}
        working-directory: ballerina
        run: |
          echo "DRY RUN — pushing to the local repository, NOT Ballerina Central."
          bal push --repository=local

      # Real publish: only on a version tag, or a manual run with publish=true.
      - name: Publish to Ballerina Central (IMMUTABLE)
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        working-directory: ballerina
        env:
          BALLERINA_CENTRAL_ACCESS_TOKEN: ${{ secrets.BALLERINA_CENTRAL_ACCESS_TOKEN }}
        run: bal push
