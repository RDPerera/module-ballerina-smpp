name: Trivy

on:
  workflow_dispatch:
  schedule:
    - cron:  '30 20 * * *'

jobs:
  call_workflow:
    name: Run Trivy Scan Workflow
    if: ${{ github.repository_owner == 'ballerina-platform' }}
    uses: ballerina-platform/ballerina-library/.github/workflows/trivy-scan-template.yml@main
    secrets: inherit
    with:
      # The examples import ballerina/smpp, which the scan's stock distribution can only
      # resolve from Ballerina Central. Re-enable once the package has its first release there.
      scan-examples: false
