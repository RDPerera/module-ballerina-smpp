name: Examples

# Builds every example against the in-repo ballerina/smpp module (each example's
# Ballerina.toml resolves the dependency with `repository = "local"` — see
# examples/README.md — since the module has not had its first Central publish yet).
# Compile-only: every example needs a real SMSC (via Config.toml) to actually run,
# which CI does not have.
on:
  push:
    branches: [ main ]
    paths: [ 'examples/**', 'ballerina/**', 'native/**', '.github/workflows/examples.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'examples/**', 'ballerina/**', 'native/**', '.github/workflows/examples.yml' ]

jobs:
  build-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.0
        with:
          version: 2201.12.0

      # Each example resolves `ballerina/smpp` with `repository = "local"`, which needs the
      # package actually present in the local Ballerina repository, not just built on disk.
      # -PpublishToLocalCentral=true makes the io.ballerina.plugin build `bal push` the packed
      # bala there (with the same distribution it built with); the module's own tests are
      # skipped since this job only compiles the examples.
      - name: Build and locally-publish the smpp module
        env:
          # Resolves io.ballerina.plugin and jballerina-tools from ballerina-platform GitHub
          # Packages, matching the convention in ballerina-library's own build templates.
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -PpublishToLocalCentral=true

      - name: Build all examples
        run: |
          set -e
          for dir in examples/send-sms examples/receive-sms examples/two-way-sms; do
            echo "::group::bal build $dir"
            (cd "$dir" && bal build)
            echo "::endgroup::"
          done
