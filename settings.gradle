pluginManagement {
    plugins {
        id "io.ballerina.plugin" version "${ballerinaGradlePluginVersion}"
        id "com.github.spotbugs" version "${spotbugsPluginVersion}"
        id "de.undercouch.download" version "${downloadPluginVersion}"
    }
    repositories {
        gradlePluginPortal()
        // io.ballerina.plugin is published only to ballerina-platform GitHub Packages, so
        // resolving it requires a GitHub PAT with read:packages exported as packageUser /
        // packagePAT (see README). This is the same requirement every module-ballerina-*
        // stdlib module has.
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }
}

def projectName = 'smpp'
rootProject.name = "module-ballerina-${projectName}"

include ":checkstyle"
include ":${projectName}-native"
include ":${projectName}-compiler-plugin"
include ":${projectName}-compiler-plugin-tests"
include ":${projectName}-ballerina"

project(":checkstyle").projectDir = file("build-config${File.separator}checkstyle")
project(":${projectName}-native").projectDir = file('native')
project(":${projectName}-compiler-plugin").projectDir = file('compiler-plugin')
project(":${projectName}-compiler-plugin-tests").projectDir = file('compiler-plugin-tests')
project(":${projectName}-ballerina").projectDir = file('ballerina')
