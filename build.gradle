plugins {
    id "com.github.spotbugs"
}

description = 'Ballerina - SMPP'

allprojects {
    group = project.group
    version = project.version

    // Registers the `publish` lifecycle task (a no-op here, since no subproject declares a
    // MavenPublication) so the shared ballerina-library CI template's `./gradlew publish`
    // step has a task to run, matching module-ballerina-email/module-ballerinax-kafka.
    apply plugin: 'maven-publish'

    repositories {
        mavenLocal()
        mavenCentral()
        // ballerina-runtime and stdlib native jars (compiled against by the native glue)
        // aren't on Maven Central.
        maven {
            url = 'https://maven.wso2.org/nexus/content/repositories/releases/'
        }
        maven {
            url = 'https://maven.wso2.org/nexus/content/groups/wso2-public/'
        }
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }

    ext {
        snapshotVersion = '-SNAPSHOT'
        timestampedVersionRegex = '.*-\\d{8}-\\d{6}-\\w.*\$'
    }
}

task build {
    dependsOn(":smpp-native:build")
    dependsOn(":smpp-compiler-plugin:build")
    dependsOn(":smpp-compiler-plugin-tests:build")
    dependsOn(":smpp-ballerina:build")
}

task clean {
    dependsOn(":smpp-native:clean")
    dependsOn(":smpp-compiler-plugin:clean")
    dependsOn(":smpp-compiler-plugin-tests:clean")
    dependsOn(":smpp-ballerina:clean")
}
