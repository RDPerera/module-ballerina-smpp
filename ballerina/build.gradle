// Uses the official io.ballerina.plugin Gradle harness, matching how module-ballerina-*
// stdlib modules are packaged (see module-ballerina-email). The plugin resolves both itself
// and the jballerina-tools distribution it builds with from ballerina-platform GitHub
// Packages, and therefore requires a read:packages PAT (packageUser / packagePAT) to build —
// see settings.gradle.
import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class BallerinaExecHelper {
    @Inject abstract ExecOperations getExecOperations()
}

plugins {
    id 'io.ballerina.plugin'
}

description = 'Ballerina - SMPP Ballerina Connector'

def packageName = "smpp"
def packageOrg = "ballerina"
def tomlVersion = stripBallerinaExtensionVersion("${project.version}")
def ballerinaTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/Ballerina.toml")
def ballerinaTomlFile = new File("$project.projectDir/Ballerina.toml")
def compilerPluginTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/CompilerPlugin.toml")
def compilerPluginTomlFile = new File("$project.projectDir/CompilerPlugin.toml")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-')
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

// `langVersion` makes the plugin unpack the matching jballerina-tools distribution into
// target/ballerina-runtime and build with it (the same mechanism every other stdlib module
// uses), rather than its Docker mode. The unpacked runtime is also what compiler-plugin-tests
// loads the fixture packages against.
ballerina {
    packageOrganization = packageOrg
    module = packageName
    langVersion = ballerinaLangVersion
}

configurations {
    externalJars
    // Consumed by the plugin's copyStdlibs task (stdlib balas to pre-seed the unpacked
    // distribution's repo with). Empty here: the package's stdlib dependencies resolve from
    // Central as usual, but the task chain must still exist - see updateTomlFiles below.
    ballerinaStdLibs
}

dependencies {
    // Bundle only jsmpp. Its one runtime dependency, slf4j-api, is already on the classpath
    // via the Ballerina runtime (ballerina-rt); bundling it too duplicates slf4j and triggers
    // a jar-conflict warning — so transitive = false. copyToLib copies the externalJars
    // configuration into ./lib, which Ballerina.toml references by path (self-contained
    // package).
    externalJars(group: 'org.jsmpp', name: 'jsmpp', version: "${jsmppVersion}") {
        transitive = false
    }
    // The distribution the plugin unpacks and builds with. The plugin adds this dependency
    // itself, but at apply time - before the `ballerina {}` block above has set langVersion -
    // so its copy reads `jballerina-tools:null`; declaring the real coordinate here (as
    // module-ballerina-email does in its root build) is what actually resolves.
    jbalTools("org.ballerinalang:jballerina-tools:${ballerinaLangVersion}") {
        transitive = false
    }
}

// Regenerate ballerina/Ballerina.toml from the build-config template, stamping in versions.
// Run in the release pipeline; the concrete Ballerina.toml is committed so a plain build works.
tasks.register('updateTomlFiles') {
    doLast {
        def newBallerinaToml = ballerinaTomlFilePlaceHolder.text.replace("@project.version@", project.version)
        newBallerinaToml = newBallerinaToml.replace("@toml.version@", tomlVersion)
        newBallerinaToml = newBallerinaToml.replace("@jsmpp.version@", jsmppVersion)
        ballerinaTomlFile.text = newBallerinaToml

        def newCompilerPluginToml = compilerPluginTomlFilePlaceHolder.text.replace(
                "@project.version@", project.version.toString())
        compilerPluginTomlFile.text = newCompilerPluginToml
    }
}

// Required by io.ballerina.plugin's build wiring (the plugin references this task by name);
// also used by the release pipeline to commit the version-stamped toml files. A no-op
// everywhere else: `ignoreExitValue true` is deliberate, since a normal `./gradlew build`
// outside the release pipeline commonly has nothing to commit (or isn't a git repo at all,
// e.g. a copied/audit checkout) - `git commit`'s failure there is expected, not a build
// problem, and must never fail the surrounding build.
tasks.register('commitTomlFiles') {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    doLast {
        execHelper.execOperations.exec {
            ignoreExitValue = true
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "git commit -m \"[Automated] Update the toml files\" Ballerina.toml Dependencies.toml CompilerPlugin.toml"
            } else {
                commandLine 'sh', '-c', "git commit -m '[Automated] Update the toml files' Ballerina.toml Dependencies.toml CompilerPlugin.toml"
            }
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact source: createArtifactZip, extension: 'zip'
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ballerina-platform/module-${packageOrg}-${packageName}")
            credentials {
                username = System.getenv("publishUser")
                password = System.getenv("publishPAT")
            }
        }
    }
}

// copyStdlibs -> unpackStdLibs -> unpackJballerinaTools is the plugin's chain that unpacks
// the jballerina-tools distribution into ballerina/build and target/ballerina-runtime;
// without this edge nothing triggers it and `bal` is simply absent at test/build time.
updateTomlFiles.dependsOn copyStdlibs

// Populate ./lib and build the native glue before the Ballerina package.
build.dependsOn "generatePomFileForMavenPublication"
build.dependsOn copyToLib
build.dependsOn ":${packageName}-native:build"
// bal reads CompilerPlugin.toml whenever it loads this package (once the compiler-plugin
// subproject is populated), and the referenced jar must exist at that path.
build.dependsOn ":${packageName}-compiler-plugin:jar"

test.dependsOn ":${packageName}-native:build"
test.dependsOn ":${packageName}-compiler-plugin:jar"
// Without this, `./gradlew :smpp-ballerina:test` on a fresh checkout fails with
// "could not locate dependency path './lib/jsmpp-...jar'" — only `build` pulled it in,
// and the main tree masked that by having the jar left over from earlier builds.
test.dependsOn copyToLib

publishToMavenLocal.dependsOn build
publish.dependsOn build

// `bal test` with coverage has been observed to exit 0 even when tests FAIL, so the plugin's
// test task, and therefore `./gradlew build`, could report BUILD SUCCESSFUL with a red suite.
// Gate on the report the test run writes instead. Skipped for GraalVM runs
// (-PbalGraalVMTest), where the plugin disables coverage and no test_results.json is written.
test {
    def resultsFile = file("${project.projectDir}/target/report/test_results.json")
    def graalvmRun = project.hasProperty('balGraalVMTest')
    // Staleness guard: a green report from a PREVIOUS run must not satisfy the gate if
    // bal test dies before writing a fresh one.
    doFirst {
        delete resultsFile
    }
    doLast {
        if (graalvmRun) {
            return
        }
        if (!resultsFile.exists()) {
            throw new GradleException("bal test produced no target/report/test_results.json — cannot verify the suite actually ran")
        }
        def results = new groovy.json.JsonSlurper().parse(resultsFile)
        if ((results.failed ?: 0) > 0 || (results.skipped ?: 0) > 0 || (results.totalTests ?: 0) == 0) {
            throw new GradleException("bal test: ${results.failed} failing / ${results.skipped} skipped / " +
                    "${results.passed} passing of ${results.totalTests} — failing the build " +
                    "(bal test itself exits 0 on test failures; skips can mask a BeforeSuite failure)")
        }
    }
}
